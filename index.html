<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 포켓몬 찾기 ⚡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #FFFDF0;
            --bg-card: #FFFFFF;
            --accent-yellow: #FFDE00;
            --accent-orange: #FF7A00;
            --text-main: #2C2C2C;
            --text-sub: #666666;
            --shadow-soft: 0 8px 24px rgba(220, 180, 80, 0.18);
            --border-radius: 20px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#FFE885 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 32px 24px;
            box-shadow: var(--shadow-soft);
            border: 3px solid #FFE885;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        header {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background-color: #FFF3B0;
            color: #8A6D00;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            color: #3B3B3B;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        p.subtitle {
            font-size: 1.05rem;
            color: var(--text-sub);
            word-break: keep-all;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .mbti-btn {
            background-color: #FFFDF0;
            border: 2px solid #FFE066;
            border-radius: 14px;
            padding: 16px 8px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #4A4A4A;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mbti-btn:hover {
            background-color: #FFE885;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 200, 0, 0.25);
            border-color: #FFD000;
        }

        .mbti-btn:active {
            transform: translateY(0);
        }

        .result-container {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pokemon-card {
            background: linear-gradient(180deg, #FFFDF0 0%, #FFF9D6 100%);
            border-radius: 18px;
            padding: 24px 16px;
            border: 2px dashed #FFD54F;
            margin-bottom: 24px;
            position: relative;
        }

        .pokemon-image-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pokemon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            animation: bounce 2.2s infinite ease-in-out;
        }

        .pokemon-fallback-emoji {
            font-size: 5rem;
            display: none;
            animation: bounce 2.2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .pokemon-title {
            font-size: 1.1rem;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .pokemon-name {
            font-size: 2.1rem;
            font-weight: 900;
            color: #222;
            margin-bottom: 16px;
        }

        .reason-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #333;
            text-align: left;
            word-break: keep-all;
            border: 1px solid #FFE082;
        }

        .match-card {
            background-color: #FFF8E1;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
            text-align: left;
            border: 1px solid #FFECB3;
        }

        .match-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #E65100;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .match-img-wrapper {
            width: 64px;
            height: 64px;
            background: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #FFE082;
            flex-shrink: 0;
            overflow: hidden;
        }

        .match-img {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .match-fallback-emoji {
            font-size: 1.8rem;
            display: none;
        }

        .match-info {
            flex-grow: 1;
        }

        .match-mbti-name {
            font-weight: 800;
            font-size: 1.1rem;
            color: #222;
        }

        .match-desc {
            font-size: 0.95rem;
            color: #555;
            margin-top: 2px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .btn-retry {
            width: 100%;
            background: linear-gradient(180deg, #FFDE00 0%, #F5B800 100%);
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245, 184, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-retry:hover {
            background: linear-gradient(180deg, #FFE53B 0%, #FFC107 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(245, 184, 0, 0.5);
        }

        @media (max-width: 420px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .container {
                padding: 24px 16px;
            }
        }
    </style>
</head>

    <div class="container">
        <!-- MBTI 선택 화면 -->
        <div id="selection-screen">

                <span class="badge">MBTI X POKÉMON</span>

            </header>

            <div class="mbti-grid" id="mbti-grid"></div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="result-container">
            <header>

                <h1>나의 포켓몬 파트너</h1>

            <div class="pokemon-card">

                </div>

                <div id="pokemon-name" class="pokemon-name">포켓몬 이름</div>
                
                <div class="reason-box" id="pokemon-reason">
                    어울리는 이유 설명입니다.
                </div>
            </div>

            <!-- 환상의 궁합 파트너 -->
            <div class="match-card">
                <div class="match-title">

                <div class="match-content">

                    </div>
                    <div class="match-info">
                        <div id="match-mbti-name" class="match-mbti-name">궁합 MBTI</div>
                        <div id="match-desc" class="match-desc">궁합 설명입니다.</div>
                    </div>
                </div>
            </div>

            <button class="btn-retry" onclick="resetSelection()">↺ 다시 고르기</button>
        </div>
    </div>

                matchDesc: '통통 튀는 푸린의 신나는 에너지를 이상해씨가 묵묵히 다정하게 감싸줍니다.'
            },
            'ISTJ': {
                id: 248,
                name: '마기라스',
                title: '신중하고 철두철미한 원칙주의자',
                emoji: '🪨',
                reason: '어떠한 흔들림에도 단단하고 신중하게 자기 자리를 지킵니다. 강한 책임감과 철저한 원칙으로 목표를 완성해냅니다.',
                matchMbti: 'ESFP',
                matchId: 39,
                matchName: '푸린',
                matchEmoji: '🎤',
                matchDesc: '푸린의 밝고 자유로운 표현력이 마기라스의 무게감 있는 일상에 밝은 미소를 전합니다.'
            }
        };

        const mbtiList = [
            'INFP', 'INFJ', 'ENFP', 'ENTP',
            'INTJ', 'INTP', 'ENFJ', 'ENTJ',
            'ISFP', 'ISFJ', 'ESFP', 'ESTP',
            'ISTJ', 'ISTP', 'ESFJ', 'ESTJ'
        ];

        window.onload = function() {
            const gridContainer = document.getElementById('mbti-grid');
            mbtiList.forEach(mbti => {
                const btn = document.createElement('button');
                btn.className = 'mbti-btn';
                btn.innerHTML = `<span>${mbti}</span>`;
                btn.onclick = () => selectMBTI(mbti);
                gridContainer.appendChild(btn);
            });
        };

        function handleImageError(imgElem, fallbackEmojiId) {
            imgElem.style.display = 'none';
            const fallbackElem = document.getElementById(fallbackEmojiId);
            if (fallbackElem) {
                fallbackElem.style.display = 'block';
            }
        }

        function selectMBTI(mbti) {
            const data = mbtiPokemonData[mbti];
            if (!data) return;

            document.getElementById('result-mbti-badge').innerText = `${mbti} 파트너`;
            document.getElementById('pokemon-name').innerText = data.name;
            document.getElementById('pokemon-title').innerText = `"${data.title}"`;
            document.getElementById('pokemon-reason').innerText = data.reason;

            const mainImg = document.getElementById('pokemon-img');
            const mainEmoji = document.getElementById('pokemon-emoji');
            mainEmoji.innerText = data.emoji;
            mainEmoji.style.display = 'none';
            mainImg.style.display = 'block';
            mainImg.src = getOfficialArtworkUrl(data.id);

            document.getElementById('match-mbti-name').innerText = `${data.matchMbti} (${data.matchName})`;
            document.getElementById('match-desc').innerText = data.matchDesc;

            const matchImg = document.getElementById('match-img');
            const matchEmoji = document.getElementById('match-emoji');
            matchEmoji.innerText = data.matchEmoji;
            matchEmoji.style.display = 'none';
            matchImg.style.display = 'block';
            matchImg.src = getOfficialArtworkUrl(data.matchId);

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetSelection() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
